name: build

on:
  workflow_call:
    inputs:
      image_name:
        description: Folder name of the image to build
        required: true
        type: string
      push:
        description: Push the image to the registry (false = build only)
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-${{ inputs.image_name }}-${{ inputs.push }}
      cancel-in-progress: false

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read image config
        id: cfg
        run: |
          echo "multiarch=$(jq -r --arg i '${{ inputs.image_name }}' '.[$i].multiarch // false' .github/images.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.cfg.outputs.multiarch == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image tags
        id: tag
        if: inputs.push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          {
            echo "tags<<EOF"
            bash .github/scripts/resolve-tag.sh "${{ inputs.image_name }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}
          tags: ${{ inputs.push && steps.tag.outputs.tags || 'type=raw,value=test' }}

      - name: Log in to the Container registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.image_name }}
          push: ${{ inputs.push }}
          platforms: ${{ steps.cfg.outputs.multiarch == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
