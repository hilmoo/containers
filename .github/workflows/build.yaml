name: build

on:
  workflow_call:
    inputs:
      image_name:
        description: Folder name of the image to build
        required: true
        type: string
      push:
        description: Push the image to the registry (false = build only)
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-${{ inputs.image_name }}-${{ inputs.push }}
      cancel-in-progress: false

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read image config
        id: cfg
        run: |
          echo "multiarch=$(jq -r --arg i '${{ inputs.image_name }}' '.[$i].multiarch // false' .github/images.json)" >> "$GITHUB_OUTPUT"
          echo "devcontainer=$(jq -r --arg i '${{ inputs.image_name }}' '.[$i].devcontainer // false' .github/images.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.cfg.outputs.multiarch == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Resolve image tags
        id: tag
        if: inputs.push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          {
            echo "tags<<EOF"
            bash .github/scripts/resolve-tag.sh "${{ inputs.image_name }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}
          tags: ${{ inputs.push && steps.tag.outputs.tags || 'type=raw,value=test' }}

      - name: Keep Dockerfile description label
        id: labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          {
            echo "labels<<EOF"
            grep -v '^org.opencontainers.image.description=' <<< "$LABELS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.cfg.outputs.devcontainer != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ inputs.image_name }}
          push: ${{ inputs.push }}
          platforms: ${{ steps.cfg.outputs.multiarch == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Drop the repo-level description so the Dockerfile's own LABEL wins
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

      # Images with "devcontainer": true are built with the official devcontainer CLI
      # from <folder>/.devcontainer/devcontainer.json, so features end up baked into the image.
      - name: Build and push devcontainer image
        if: steps.cfg.outputs.devcontainer == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.labels.outputs.labels }}
          PLATFORM: ${{ steps.cfg.outputs.multiarch == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          PUSH: ${{ inputs.push }}
        run: |
          npm install -g @devcontainers/cli@0.89.0
          args=(--workspace-folder "${{ inputs.image_name }}")
          while read -r tag; do args+=(--image-name "$tag"); done <<< "$TAGS"
          while read -r label; do [ -n "$label" ] && args+=(--label "$label"); done <<< "$LABELS"
          if [ "$PUSH" = true ]; then
            args+=(--platform "$PLATFORM" --push)
          fi
          devcontainer build "${args[@]}"
